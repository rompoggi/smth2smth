# @package _global_
# Dataset paths. Override at the CLI when your folder layout differs.
#
# Layout (Option A: minimalist, single canonical dataset at the data/ root):
#   data/
#     train/
#     val/
#     test/
#
# Augmentation: ONLINE only (transforms applied in build_transforms at __getitem__).
# No on-disk augmented copies => no augmented/ folder. The augmented_dirs field
# is kept as a forward-compatible hook in case offline augmentation is ever added.
dataset:
  root: ${hydra:runtime.cwd}/data
  train_dir: ${dataset.root}/train
  val_dir: ${dataset.root}/val
  test_dir: ${dataset.root}/test
  augmented_dirs: []
  test_manifest: null
  submission_output: ${hydra:runtime.cwd}/submission.csv

  num_frames: 8
  val_ratio: 0.2
  # When true, validate on the *official* held-out folder ``${dataset.val_dir}``
  # instead of carving an in-distribution slice out of ``${dataset.train_dir}``.
  # The 80/20 internal split (``val_ratio``) is ignored when this is on.
  # Default stays false to preserve historical run reproducibility.
  use_official_val: false
  seed: ${seed}
  max_samples: null
  # Balanced per-class subsampling (see ``train._balanced_per_class_subsample``).
  max_samples_per_class: null
  image_size: 224
  # Motion-aware time-reversal augmentation (only applied to the train set).
  # With this probability, the sampled frame sequence is reversed *and* the
  # label is remapped via the canonical pair table (Opening<->Closing,
  # Putting-into<->Taking-out-of, Folding<->Unfolding, Covering<->Uncovering,
  # Moving-up<->Moving-down, Moving-closer<->Moving-away,
  # Pouring-in<->Pouring-out, plus Holding which is symmetric). Classes with
  # no clean temporal mirror are *not* reversed -- they would corrupt the
  # supervision signal otherwise. Default 0.0 is a no-op.
  time_reversal_prob: 0.0

  # Train-only: reverse sampled frame order and swap label (curated Track A
  # pairs). See ``temporal_pair_augment.py``. Val / submit must keep disabled.
  temporal_reversal_augment:
    enabled: false
    prob: 0.5

  # Deterministic class boosting (Track A): duplicate each train row whose label
  # is in a curated opposite pair — native row + reversed-frames row with the
  # partner label. See ``expand_train_samples_for_class_boosting``. Incompatible
  # with ``temporal_reversal_augment`` (stochastic); the latter is ignored when
  # this is enabled. Val split unchanged.
  class_boosting:
    enabled: false
