# @package _global_
# E5 — stage 1 FT (50 ep, instance-balanced). Then run e5_crt.
defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_s
  num_classes: ${num_classes}
  drop_path_rate: 0.2
  dropout: 0.5
  head: attn
  head_num_heads: 4
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e5_encoder.pt

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e5_ft.pt
  epochs: 50
  class_balance_sampler: none
  tta: true
  tta_flip: true
  tta_scales: [0.857, 1.0, 1.143]
