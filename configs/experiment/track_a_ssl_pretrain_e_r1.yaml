# @package _global_
# E_R1 — VideoMAE-V2 ViT-B SSL pretrain on train+test inputs (Sole rescue, 2026-05-16).
#
#   - Encoder: ViT-Base/16 (12L, 768d, 12h, ~87 M params), tube_t=1 (T=4 → 784 tokens,
#     ~78 visible after 0.90 tube mask; preserves V1's "~80 visible tokens" budget).
#   - Decoder: V2 dual masking — running-cell mask keeps 50% of N (2x2 cells),
#     invisible-only MSE loss (V2 Tab. 1).
#   - 200 epochs (safer half-budget; V1 paper monotonically improves to 800 on SSv2).
#   - Pretrain data: train + test inputs only (honors instruction_16052026.md hard-rule).
#
# Paired with track_a_ssl_finetune_e_r1.yaml. Output: e_r1_encoder.pt.

defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae

model:
  variant: vit_b
  tube_t: 1
  patch_size: 16
  mlp_ratio: 4.0
  gradient_checkpointing: true

augment:
  random_crop: true
  crop_padding: 32
  random_horizontal_flip: false   # SSv2 is direction-sensitive

seed: 42

dataset:
  num_frames: 4

pretrain:
  epochs: 200
  warmup_epochs: 20         # V1 uses 40 for 800 ep; scaled linearly to 200 ep
  batch_size: 16            # per-GPU; tune after smoke test
  grad_accum_steps: 8       # eff_bs = 128 (V1 linear-LR scaling baseline)
  num_frames: 4
  lr: 7.5e-5                # = 1.5e-4 * 128 / 256 (V1 linear scaling rule)
  weight_decay: 0.05
  mask_ratio: 0.90          # tube mask 0.90 (motion-centric per V1 §4)
  norm_pix: true
  drop_path_rate: 0.0

  # V2 dual masking
  dual_masking: true
  decoder_keep_ratio: 0.50
  decoder_cell_h: 2
  decoder_cell_w: 2

  # Honor instruction_16052026.md hard-rule
  include_val_in_pretrain: false

  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e_r1_encoder.pt

training:
  num_workers: 4
  device: cuda
  amp: true
  batch_size: 16
