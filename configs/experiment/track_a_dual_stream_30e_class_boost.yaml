# @package _global_
# Track A: dual-stream RGB + frame-difference TSM, 30 epochs, warmup, class boosting,
# RandAugment-T + FrameMixUp (same data stack as phase-2 style runs), official val,
# validation every epoch (training.eval_every_n_epochs default is 1).
defaults:
  - override /model: dual_stream_rgb_diff_tsm
  - override /augment: randaugment_t

model:
  pretrained: false
  drop_path_rate: 0.1
  head: attn
  head_num_heads: 4
  fuse_dim: 512

dataset:
  num_frames: 4
  use_official_val: true
  class_boosting:
    enabled: true
  temporal_reversal_augment:
    enabled: false

training:
  batch_size: 16
  epochs: 30
  lr: 0.0001
  optimizer: adamw
  weight_decay: 0.05
  scheduler_cosine: true
  warmup_epochs: 6
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: frame_mixup
  videomix_alpha: 5.0
  videomix_prob: 0.5
  amp: true
  ema_enabled: true
  ema_decay: 0.999
  eval_every_n_epochs: 1
  eval_ema: true
  tta: true
  tta_flip: true
  early_stopping_enabled: true
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  log_interval_steps: 100
