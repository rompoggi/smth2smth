# @package _global_
# E9 — VideoMAE v2 ViT-B SSL pretrain, native T=4, train+val+test.
# Spec: videomaev2_t4_native_300e_pretrain.md (extended to 500e, bs=96).
# Role: native-T=4 arm of the frame-expansion ablation.
defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae
  - override /augment: videomae_pretrain_t16

model:
  variant: vit_b
  tube_t: 1
  patch_size: 16
  mlp_ratio: 4.0
  gradient_checkpointing: false

seed: 42

dataset:
  num_frames: 4

pretrain:
  epochs: 500
  warmup_epochs: 25
  batch_size: 96
  grad_accum_steps: 2
  num_frames: 4
  # Linear LR scaling vs eff_bs=64 baseline (1.5e-4 @ bs=8, ga=8).
  lr: 4.5e-4
  weight_decay: 0.05
  mask_ratio: 0.75
  norm_pix: true
  drop_path_rate: 0.0

  dual_masking: true
  decoder_keep_ratio: 0.50
  decoder_cell_h: 2
  decoder_cell_w: 2

  include_val_in_pretrain: true
  max_grad_norm: 3.0

  ema_enabled: true
  # Recalibrated for ~305 opt steps/epoch (bs=96, ga=2) over 500 ep:
  # same ~2.85-epoch half-life as 0.9997 @ 917 steps/epoch / 300 ep.
  ema_decay: 0.9992

  checkpoint_milestones:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 350
    - 400
    - 450
    - 500
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/videomaev2_t4native_encoder.pt
  auto_resume: true

  wandb_enabled: true
  wandb_project: smth2smth-frame-ablation
  wandb_run_name: videomaev2_t4_native_500e_pretrain
  wandb_group: frame_expansion_ablation
  wandb_tags:
    - t4-native
    - vit-b
    - v2-dual-masking
    - train+val+test
    - ablation-arm-native
    - 500e
    - bs96

training:
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  device: cuda
  amp: true
  batch_size: 96
