# @package _global_
# E5 — continue 50 → 150 with batch_size=16 (2× stage-1) and scaled phase-2 LR.
#
# Same schedule as ``track_a_ssl_finetune_e5_continue150``, but:
#   - ``batch_size: 16`` (fits ~24 GiB; stage-1 at bs=8 used ~2 GiB)
#   - ``continuation_peak_lr_ratio: 0.8`` — ~linear LR scale vs bs=8 @ ratio 0.4
#     (phase-2 head peak ≈ 0.8 × phase-1 warmup_lr_max ≈ 2× the bs=8 continuation)
#
# The 5-epoch ``continuation_warmup_epochs`` ramp is the LR warmup; no extra search
# pass unless val diverges (then try ratio 0.6 or keep bs=8).

defaults:
  - track_a_ssl_finetune_e5_continue150

training:
  batch_size: 16
  # Peak LRs come from continuation_rewarm_lr (ratio × phase-1 warmup_lr_max), NOT
  # training.lr — leave resume_apply_cfg_lr=false.  Ratio 0.8 → head peak ≈ 4e-4
  # (0.8 × 5e-4), not 1e-3.  Larger batch already reduces gradient noise.
  continuation_peak_lr_ratio: 0.5
  continuation_warmup_epochs: 6
