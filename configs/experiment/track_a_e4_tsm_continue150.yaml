# @package _global_
# E4 continuation — epochs 90→150 after the SGDR 90-ep run completes.
# Linear warmup (10 ep) + cosine decay on the remaining 50 ep; same R50+TSM recipe
# as ``track_a_e4_tsm_sgdr`` / phase-2 (AdamW, EMA, RandAugment-T, bs=16).
#
# Launch only after the 90-ep job finishes and ``e4_ft.last.pt`` records epoch 90:
#   training.resume_from=${hydra:runtime.cwd}/checkpoints/track_a/e4_ft.last.pt
defaults:
  - override /model: avanced_resnet50_tsm
  - override /augment: randaugment_t

model:
  pretrained: false
  init_from: null
  drop_path_rate: 0.1
  dropout: 0.5
  head: attn
  head_num_heads: 4

augment:
  random_horizontal_flip: true
  random_crop: true
  crop_padding: 32

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/e4_ft.pt
  last_checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/e4_ft_150.last.pt
  batch_size: 16
  epochs: 150
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.05
  scheduler: cosine
  scheduler_cosine: true
  sgdr_save_snapshots: false
  warmup_epochs: 10
  resume_apply_cfg_lr: true
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: frame_mixup
  videomix_alpha: 5.0
  videomix_prob: 0.5
  amp: true
  amp_dtype: float16
  ema_enabled: true
  ema_decay: 0.999
  num_workers: 4
  log_interval_steps: 100
  tta: true
  tta_flip: true
  tta_scales: [0.875, 1.0, 1.125]
