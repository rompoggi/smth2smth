# @package _global_
# E7 champion FT — continue to 150 epochs (batch 16, gentle resume).
#
# Resume from ``e7_ft.pt`` (best champion weights). Do **not** use
# ``e7_ft.last.pt`` after a failed continue — it may contain corrupted
# optimizer state.
#
# Schedule vs champion (bs=8, lr=5e-4, 60 ep):
#   - batch_size 16, repeated_aug=2 (same steps/epoch as bs=8)
#   - Keep peak lr=5e-4; restore optimizer + cosine from checkpoint
#     (``resume_apply_cfg_lr=false``) — avoids LR shock and LLRD flattening
#   - warmup_epochs=6 unchanged; no re-warmup when start_epoch>=6
#   - epochs=150 total budget

defaults:
  - track_a_ssl_finetune_e7

model:
  init_from: null

training:
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e7_ft.pt
  resume_apply_cfg_lr: false
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e7_ft.pt
  epochs: 150
  batch_size: 16
  repeated_aug: 2
  lr: 0.0005
  warmup_epochs: 6
  min_lr: 0.000001
  early_stopping_enabled: true
  early_stopping_patience: 40
  early_stopping_min_delta: 0.001
