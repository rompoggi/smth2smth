# @package _global_
# E_R1 — Champion-stack FT of the ViT-B / tube_t=1 encoder produced by
# track_a_ssl_pretrain_e_r1. 60 epochs at T=4, LLRD 0.75, mixup+cutmix switch,
# attentive head, ema 0.999.

defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_b
  num_classes: ${num_classes}
  tube_t: 1
  drop_path_rate: 0.1     # MAE-ST FT recipe for ViT-B (V1/V2 default)
  dropout: 0.0
  head: attn
  head_num_heads: 4
  gradient_checkpointing: true
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e_r1_encoder.pt

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e_r1_ft.pt
  epochs: 60
  warmup_epochs: 5
  lr: 0.0005              # V1 SSv2 default
  batch_size: 16
  grad_accum_steps: 4     # eff_bs = 64 (3090 ceiling at ViT-B + bf16 + grad-ckpt)
  ema_decay: 0.999        # per E_R1 spec (champion default is 0.9999)
  tta: true
  tta_flip: true
  tta_scales: [0.857, 1.0, 1.143]
