# @package _global_
# Legacy alias — defaults for the espadon T=16 / ep50 encoder run.
# Prefer: experiment=track_a_videomae_official_ssv2_ft + scripts/launch_videomae_official_ssv2_ft.sh
defaults:
  - track_a_videomae_official_ssv2_ft

model:
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/espadon_t16_encoder_ep50.pt

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/videomaev2+ft/mae50-ft-f16.pt
  wandb:
    name: mae50-ft-f16
    tags:
      - f16
      - T16
      - espadon
