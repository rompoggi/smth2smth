# @package _global_
# E5 silure2 — MAE pretrain (same as E1 requin). Pair with silure2 FT + cRT stage.
defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae

model:
  variant: vit_s
  tube_t: 2
  patch_size: 16
  mlp_ratio: 4.0

augment:
  random_crop: true
  crop_padding: 32
  random_horizontal_flip: false

seed: 42

pretrain:
  epochs: 100
  warmup_epochs: 5
  batch_size: 16
  lr: 0.00015
  mask_ratio: 0.75
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/silure2_encoder.pt

training:
  num_workers: 4
  device: cuda
  amp: true
  batch_size: 16
