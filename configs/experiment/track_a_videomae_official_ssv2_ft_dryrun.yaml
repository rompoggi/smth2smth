# @package _global_
# One-epoch smoke test for track_a_videomae_official_ssv2_ft.
#
#   SSL_ENCODER=checkpoints/track_a/ssl/espadon_t16_encoder_ep50.pt \
#   RUN_NAME=mae50-ft-f16-dryrun \
#   NOHUP=0 ./scripts/launch_videomae_official_ssv2_ft.sh \
#     experiment=track_a_videomae_official_ssv2_ft_dryrun
#
# Or:
#   ./scripts/dryrun_videomae_official_ssv2_ft.sh [SSL_ENCODER]
defaults:
  - track_a_videomae_official_ssv2_ft

dataset:
  max_samples: 64

training:
  epochs: 1
  num_workers: 2
  early_stopping_enabled: false
  wandb:
    mode: online

test:
  num_segment: 1
  num_crop: 1
