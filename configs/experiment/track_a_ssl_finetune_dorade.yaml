# @package _global_
# E6 dorade — FT @256, lighter reg (dp=0.1, do=0). Pair with track_a_ssl_pretrain_dorade.
defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_s
  num_classes: ${num_classes}
  drop_path_rate: 0.1
  dropout: 0.0
  head: attn
  head_num_heads: 4
  interpolate_pos_embed: true
  interpolate_src_image_size: 224
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/dorade_encoder.pt

dataset:
  num_frames: 4
  image_size: 256
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/dorade_ft.pt
  batch_size: 12
  epochs: 50
  tta: true
  tta_flip: true
  tta_scales: [0.875, 1.0, 1.125]
