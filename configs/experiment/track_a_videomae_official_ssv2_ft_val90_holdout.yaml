# @package _global_
# Official SSv2 FT continuation: train on train + 90% of official val (stratified),
# evaluate on 10% holdout. 10 epochs, 2-epoch warmup, patience 4.
# Resume from honest FT best (``mae{EPT}-ft-f{F}.pt``). Same optimizer/aug recipe
# as ``track_a_videomae_official_ssv2_ft``; override ``resume_from`` / ``checkpoint_path``
# / ``training.wandb.name`` / ``dataset.num_frames`` at launch.

defaults:
  - track_a_videomae_official_ssv2_ft

model:
  init_from: null

dataset:
  use_official_val: true
  include_val_in_train: false
  official_val_holdout_ratio: 0.1

training:
  resume_from: null
  resume_reset_epoch: true
  resume_apply_cfg_lr: true
  lr: 0.00005
  epochs: 10
  warmup_epochs: 2
  early_stopping_patience: 4
