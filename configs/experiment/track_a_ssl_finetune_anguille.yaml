# @package _global_
# SSL sweep slot — fine-tune with attentive probe. Run after pretrain wrote encoder.
# ``model.init_from`` must match the pretrain checkpoint for this fish.

defaults:
  - override /model: video_mae_vit
  - override /augment: randaugment_t

model:
  variant: vit_b
  num_classes: ${num_classes}
  drop_path_rate: 0.1
  dropout: 0.0
  head: attn
  head_num_heads: 4
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/anguille_encoder.pt

augment:
  random_horizontal_flip: false
  random_crop: true
  crop_padding: 32
  randaugment:
    enabled: true
    n: 4
    m: 7.0
    mode: temporal_plus

dataset:
  num_frames: 4
  use_official_val: true

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/anguille_ft.pt
  batch_size: 16
  epochs: 30
  optimizer: adamw
  lr: 0.0002
  weight_decay: 0.05
  scheduler_cosine: true
  warmup_epochs: 5
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: cube_cutmix
  videomix_alpha: 1.0
  videomix_prob: 0.5
  amp: true
  ema_enabled: true
  ema_decay: 0.9999
  num_workers: 4
  log_interval_steps: 100
  early_stopping_enabled: true
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
