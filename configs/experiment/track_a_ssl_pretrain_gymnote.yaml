# @package _global_
# SSL sweep slot — VideoMAE pretrain only. Pair with ``track_a_ssl_finetune_gymnote.yaml``
# after this run finishes. See ``SSL.md``.

defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae

model:
  variant: vit_b
  tube_t: 2
  patch_size: 16
  mlp_ratio: 4.0

augment:
  random_crop: true
  crop_padding: 32
  random_horizontal_flip: false

seed: 42

pretrain:
  epochs: 200
  warmup_epochs: 5
  batch_size: 16
  lr: 0.00015
  mask_ratio: 0.75
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/gymnote_encoder.pt

training:
  num_workers: 4
  device: cuda
  amp: true
  batch_size: 16
