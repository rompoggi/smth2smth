# @package _global_
# E4 final fine-tune: train+official val, low LR, effective batch 64 (bs=16 × accum=4).
# Loads best weights from the 150-ep E4 run; val metrics are leaky (val in train).
defaults:
  - override /model: avanced_resnet50_tsm
  - override /augment: randaugment_t

model:
  pretrained: false
  init_from: null
  drop_path_rate: 0.1
  dropout: 0.5
  head: attn
  head_num_heads: 4

augment:
  random_horizontal_flip: true
  random_crop: true
  crop_padding: 32

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: true

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/e4_ft_trainval.pt
  last_checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/e4_ft_trainval.last.pt
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/e4_ft.pt
  reset_epoch_on_resume: true
  resume_apply_cfg_lr: true
  batch_size: 16
  grad_accum_steps: 4
  epochs: 25
  optimizer: adamw
  lr: 0.00001
  weight_decay: 0.01
  scheduler: cosine
  scheduler_cosine: true
  warmup_epochs: 3
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: frame_mixup
  videomix_alpha: 5.0
  videomix_prob: 0.5
  amp: true
  amp_dtype: float16
  ema_enabled: true
  ema_decay: 0.999
  num_workers: 4
  log_interval_steps: 100
  tta: true
  tta_flip: true
  tta_scales: [0.875, 1.0, 1.125]
