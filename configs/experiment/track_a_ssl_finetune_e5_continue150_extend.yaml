# @package _global_
# E5 — extend stage-1 FT at tail learning rate (epochs 50 → 150).
#
# Alternative to ``track_a_ssl_finetune_e5_continue150``: restores the
# phase-1 cosine scheduler state (near ``min_lr``) and keeps training ~100
# more epochs without a new warmup. Use when val still rises but you want
# minimal hyperparameter change.
#
# Run ONLY after stage-1 wrote ``e5_ft.last.pt``.

defaults:
  - track_a_ssl_finetune_e5

model:
  init_from: null

training:
  epochs: 150
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e5_ft.last.pt
  resume_reset_scheduler: false
  continuation_rewarm_lr: false
  resume_apply_cfg_lr: false
  early_stopping_patience: 35
  early_stopping_min_delta: 0.001
