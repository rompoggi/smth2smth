# @package _global_
# Continue SSL fine-tune for codename ``raie`` from ``raie_ft.last.pt``.
# Keeps ``dataset.use_official_val=true``: train on all of ``data/train``,
# evaluate each epoch on all labeled clips under ``data/val``.
#
# Run after ``track_a_ssl_finetune_raie`` completed (or any run that wrote
# ``checkpoints/track_a/ssl/raie_ft.last.pt``).

defaults:
  - track_a_ssl_finetune_raie

model:
  # Weights come entirely from ``training.resume_from``; skip redundant encoder load.
  init_from: null

training:
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/raie_ft.last.pt
  epochs: 60
