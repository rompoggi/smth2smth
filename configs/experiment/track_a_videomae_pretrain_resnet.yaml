# @package _global_
# VideoMAE pretraining on TSM ResNet-50 (same trunk as ``track_a_phase2``).
#
# Output: ``trunk_state_dict`` with plain ResNet+TSM keys loadable via
# ``model.init_from`` on ``avanced_resnet50_tsm`` (Phase-2 supervised run).
#
# Run from repo root:
#   PYTHONPATH=src uv run python -m smth2smth.pipelines.pretrain_videomae \
#       experiment=track_a_videomae_pretrain_resnet
#
# Smoke: pretrain.max_videos=32 pretrain.epochs=1
defaults:
  - override /model: video_mae_resnet
  - override /pretrain: videomae

# No flip (SSv2 is direction-sensitive). Mild spatial aug only.
augment:
  random_crop: true
  crop_padding: 32
  random_horizontal_flip: false

pretrain:
  epochs: 100
  warmup_epochs: 5
  batch_size: 16
  lr: 0.00015
  mask_ratio: 0.75
  norm_feat: true
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/videomae_encoder_resnet50_tsm_e100.pt

training:
  num_workers: 4
  device: cuda
  amp: true
