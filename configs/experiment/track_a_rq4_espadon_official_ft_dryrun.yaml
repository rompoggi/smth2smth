# @package _global_
# RQ4 dry-run: 64 train clips, 1 epoch, small batch — validates init, aug, mixup, W&B.
#
#   PYTHONPATH=src uv run python -m smth2smth.pipelines.train \
#       experiment=track_a_rq4_espadon_official_ft_dryrun

defaults:
  - track_a_mae25_ft

dataset:
  max_samples: 64

training:
  batch_size: 2
  grad_accum_steps: 1
  epochs: 1
  num_workers: 2
  early_stopping_enabled: false
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/videomaev2+ft/_dryrun_espadon_official.pt
  wandb:
    enabled: true
    project: smth2smth-track-a
    entity: null
    name: espadon_official_dryrun
    tags:
      - dry-run
      - rq4
      - espadon
    mode: online
    log_interval_epochs: 1

test:
  num_segment: 1
  num_crop: 1
  flip_tta: false
