# @package _global_
# 1-epoch smoke test for stabilized diverse-head presets (64 clips).
# Used by scripts/dryrun_diverse_heads_stab.sh — set EXPERIMENT per arch.
defaults:
  - track_a_diverse_arch2_perceiver_stab

dataset:
  max_samples: 64

training:
  epochs: 1
  num_workers: 2
  early_stopping_enabled: false
  wandb:
    enabled: false
    mode: disabled

test:
  num_segment: 1
  num_crop: 1
