# @package _global_
# Track B round-1 overnight grid — custom AttentiveProbe on SSv2-FT ViT-L (Exp 1 MQ).
#
# Uses the ``vjepa2`` builder (multi-query attentive head + LoRA). Unlike
# ``track_b_vjepa2_hfclf_16f_lora_r16``, this does *not* load Meta's HF
# 4-block pooler; the probe is trained from scratch on frozen+LoRA encoder features.
#
# Shared by r1_b07–b11; each child preset overrides LR / Q / head_type only.
defaults:
  - track_b_r1_data
  - override /model: vjepa2
  - override /augment: vjepa2_heavy

augment:
  random_horizontal_flip: false

model:
  pretrained: true
  hf_repo: facebook/vjepa2-vitl-fpc16-256-ssv2
  head_type: attentive
  head_num_heads: 16
  head_num_queries: 16
  head_dropout: 0.1
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  freeze_backbone: true
  attn_implementation: sdpa

dataset:
  num_frames: 16
  image_size: 256
  use_official_val: true

training:
  batch_size: 4
  grad_accum_steps: 6
  epochs: 15
  num_workers: 4
  lr: 0.001
  lora_lr: 0.0001
  optimizer: adamw
  weight_decay: 0.05
  scheduler_cosine: true
  warmup_epochs: 0
  min_lr: 0.00001
  label_smoothing: 0.1
  amp: true
  amp_dtype: bf16
  ema_enabled: false
  eval_every_n_epochs: 1
  eval_ema: false
  early_stopping_enabled: false
  save_last_checkpoint: true
  log_interval_steps: 25
  tta: true
  tta_flip: false
  val_eval_tta: false
  wandb_enabled: true
  wandb_project: smth2smth-track-b
  wandb_group: track_b_r1_overnight
  wandb_tags:
    - track_b
    - r1_overnight
    - mq_probe

test:
  num_segment: 2
  num_crop: 3
  flip_tta: false
