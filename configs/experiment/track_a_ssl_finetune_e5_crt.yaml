# @package _global_
# E5 — stage 2 cRT: frozen backbone, sqrt_inverse sampler, 10 ep.
defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_s
  num_classes: ${num_classes}
  drop_path_rate: 0.2
  dropout: 0.5
  head: attn
  head_num_heads: 4
  freeze_backbone: true
  init_from: null

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e5_ft_crt.pt
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/e5_ft.pt
  epochs: 10
  lr: 0.0001
  layer_decay: null
  repeated_aug: 1
  class_balance_sampler: sqrt_inverse
  early_stopping_enabled: false
  tta: true
  tta_flip: true
  tta_scales: [0.857, 1.0, 1.143]
  tta_logit_adjust: 0.0
