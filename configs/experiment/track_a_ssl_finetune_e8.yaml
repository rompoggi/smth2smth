# @package _global_
# E8 (espadon) — champion FT ViT-B, 60 ep. Run after track_a_ssl_pretrain_e8.
defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_b
  tube_t: 1
  num_classes: ${num_classes}
  drop_path_rate: 0.2
  dropout: 0.5
  head: attn
  head_num_heads: 4
  gradient_checkpointing: true
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/espadon_encoder.pt

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/espadon_ft.pt
  batch_size: 4
  grad_accum_steps: 4
  tta: true
  tta_flip: true
  tta_scales: [0.857, 1.0, 1.143]
