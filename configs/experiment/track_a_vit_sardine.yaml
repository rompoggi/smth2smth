# @package _global_
# sardine — ViT-S/16 from scratch, large batch + heavy RandAugment.
#
# Rationale: the ``truite`` ViT-B/16 from-scratch run plateaued near 5 % val
# top-1 (see logs/truite.log) — too few inductive biases and too many params
# for 45k clips.  ViT-S (embed_dim=384, depth=12, heads=6, ~22M params) has
# 4x fewer parameters; we compensate the regularisation budget with a 4x
# larger batch and a heavier RandAugment-T schedule (n=6, m=10).  Learning
# rate is sqrt-scaled (5e-4 -> 1e-3) and warmup is doubled (5 -> 10 epochs)
# since ViTs from scratch are notoriously sensitive to LR/warmup.
#
# Assigned to: Romain
#
# Run:
#   PYTHONPATH=src uv run python -m smth2smth.pipelines.train \
#       experiment=track_a_vit_sardine
defaults:
  - override /model: video_mae_vit
  - override /augment: randaugment_t

model:
  variant: vit_s
  num_classes: ${num_classes}
  drop_path_rate: 0.1
  dropout: 0.0
  head: mean
  init_from: null

# SSv2 is direction-sensitive: keep horizontal flip OFF.
# RandAugment-T cranked: n=6 ops, magnitude 10 (truite used n=4 m=7).
augment:
  random_horizontal_flip: false
  random_crop: true
  crop_padding: 32
  sync_across_frames: true
  randaugment:
    enabled: true
    n: 6
    m: 10.0
    mode: temporal_plus
    magnitude_max: 30.0

dataset:
  num_frames: 4
  use_official_val: true
  class_boosting:
    enabled: false

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/vit_sardine.pt
  batch_size: 64
  epochs: 80
  num_workers: 8
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.05
  scheduler_cosine: true
  warmup_epochs: 10
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: cube_cutmix
  videomix_alpha: 1.0
  videomix_prob: 0.5
  amp: true
  ema_enabled: true
  ema_decay: 0.9999
  eval_every_n_epochs: 1
  eval_ema: true
  tta: true
  tta_flip: false
  log_interval_steps: 50
  early_stopping_enabled: true
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
