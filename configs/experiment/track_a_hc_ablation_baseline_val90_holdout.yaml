# @package _global_
# HC baseline (seed 44) continuation: train on train + 90% of official val
# (stratified), evaluate on 10% holdout. 10 epochs, low LR, 2-epoch warmup.
# Resume from honest FT best (EMA val top1 on full official val).

defaults:
  - track_a_hc_ablation_baseline

model:
  init_from: null

dataset:
  use_official_val: true
  include_val_in_train: false
  official_val_holdout_ratio: 0.1

seed: 44

training:
  resume_from: ${hydra:runtime.cwd}/checkpoints/track_a/hc/baseline_s${seed}_ft.pt
  resume_reset_epoch: true
  resume_apply_cfg_lr: true
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/hc/baseline_s${seed}_ft_val90_holdout.pt
  epochs: 10
  warmup_epochs: 2
  lr: 0.00005
  early_stopping_patience: 4
  stability_log_path: null
