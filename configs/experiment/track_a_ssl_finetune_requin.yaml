# @package _global_
# E1 requin — champion FT stack (60 ep). Run after track_a_ssl_pretrain_requin.
defaults:
  - override /model: video_mae_vit
  - override /augment: champion_ft
  - override /train: champion_videomae

model:
  variant: vit_s
  num_classes: ${num_classes}
  drop_path_rate: 0.2
  dropout: 0.5
  head: attn
  head_num_heads: 4
  init_from: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/requin_encoder.pt

dataset:
  num_frames: 4
  use_official_val: true
  include_val_in_train: false

seed: 42

training:
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/requin_ft.pt
  tta: true
  tta_flip: true
  tta_scales: [0.857, 1.0, 1.143]
