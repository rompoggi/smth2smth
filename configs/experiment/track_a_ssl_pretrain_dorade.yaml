# @package _global_
# E6 dorade — MAE pretrain @224 (same as E1). FT @256 in finetune yaml.
defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae

model:
  variant: vit_s
  tube_t: 2
  patch_size: 16
  mlp_ratio: 4.0

augment:
  random_crop: true
  crop_padding: 32
  random_horizontal_flip: false

seed: 42

pretrain:
  epochs: 100
  warmup_epochs: 5
  batch_size: 16
  lr: 0.00015
  mask_ratio: 0.75
  image_size: 224
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/dorade_encoder.pt

training:
  num_workers: 4
  device: cuda
  amp: true
  batch_size: 16
