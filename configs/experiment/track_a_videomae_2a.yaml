# @package _global_
# Experiment 2a — VideoMAE SSL pre-train → ViT-B fine-tune, mean-pool classifier.
#
# Assigned to: Thomas
#
# Step 1 — pre-train (if not already done):
#   PYTHONPATH=src uv run python -m smth2smth.pipelines.pretrain_videomae \
#       experiment=track_a_videomae_pretrain
#
# Step 2 — fine-tune:
#   PYTHONPATH=src uv run python -m smth2smth.pipelines.train \
#       experiment=track_a_videomae_2a \
#       model.init_from=<path/to/videomae_encoder.pt>
defaults:
  - override /model: video_mae_vit
  - override /augment: randaugment_t

model:
  variant: vit_b
  num_classes: ${num_classes}
  drop_path_rate: 0.1
  dropout: 0.0
  head: mean
  # Set at CLI: model.init_from=<path>/videomae_encoder.pt
  init_from: null

augment:
  random_horizontal_flip: false
  random_crop: true
  crop_padding: 32
  randaugment:
    enabled: true
    n: 4
    m: 7.0
    mode: temporal_plus

dataset:
  num_frames: 4
  use_official_val: true

training:
  batch_size: 16
  # Slightly fewer epochs: SSL warm-start converges faster.
  epochs: 30
  optimizer: adamw
  lr: 0.0002
  weight_decay: 0.05
  scheduler_cosine: true
  warmup_epochs: 5
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: cube_cutmix
  videomix_alpha: 1.0
  videomix_prob: 0.5
  amp: true
  ema_enabled: true
  ema_decay: 0.9999
  num_workers: 4
  log_interval_steps: 100
  early_stopping_enabled: true
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
