# @package _global_
# VideoMAEv2 ViT-B SSL pretrain 250 ep @ T=16 (4-frame -> 16 interpolation).
# Spec: experiments/videomaev2_250e_pretrain.md
defaults:
  - override /model: video_mae_vit
  - override /pretrain: videomae
  - override /augment: videomae_pretrain_t16

model:
  variant: vit_b
  tube_t: 1
  patch_size: 16
  mlp_ratio: 4.0
  gradient_checkpointing: true

seed: 42

dataset:
  num_frames: 16

pretrain:
  epochs: 250
  warmup_epochs: 15
  batch_size: 4
  grad_accum_steps: 16
  num_frames: 16
  source_num_frames: 4
  temporal_expand_mode: interpolation
  lr: 0.00015
  weight_decay: 0.05
  mask_ratio: 0.75
  norm_pix: true
  drop_path_rate: 0.0
  dual_masking: true
  decoder_keep_ratio: 0.50
  decoder_cell_h: 2
  decoder_cell_w: 2
  include_val_in_pretrain: true
  max_grad_norm: 3.0
  ema_enabled: true
  ema_decay: 0.9999
  checkpoint_milestones: [50, 100, 150, 200, 250]
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/track_a/ssl/espadon_t16_encoder.pt
  auto_resume: true
  wandb_enabled: true
  wandb_project: smth2smth
  wandb_run_name: videomaev2_250e_pre_train
  wandb_group: track_a_videomaev2_pretrain

training:
  num_workers: 4
  device: cuda
  amp: true
  batch_size: 4
