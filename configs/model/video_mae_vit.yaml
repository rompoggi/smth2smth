# @package _global_
model:
  name: video_mae_vit
  variant: vit_b          # vit_b (12L, 768d, 86M) or vit_l (24L, 1024d, 307M)
  num_classes: ${num_classes}
  tube_t: 2               # temporal cube depth (2 frames → 1 token)
  patch_size: 16          # spatial patch size
  mlp_ratio: 4.0
  drop_path_rate: 0.0     # stochastic depth (set to 0.1 at fine-tune time)
  dropout: 0.0
  head: mean              # mean (VideoMAE paper) or attn (attentive probe)
  head_num_heads: 4       # only used when head=attn
  init_from: null         # path to a VideoMAE SSL encoder checkpoint
  # Fine-tune at a different resolution than pretrain (e.g. 224→256).
  interpolate_pos_embed: false
  interpolate_src_image_size: 224
  interpolate_src_num_frames: ${dataset.num_frames}
  # Activation checkpointing inside encoder blocks (saves VRAM, slower).
  gradient_checkpointing: false
  # cRT stage 2: freeze encoder + attentive pool; train classifier only.
  freeze_backbone: false
  # Residual structure of the encoder blocks. Default 'prenorm' is the standard
  # Pre-Norm Transformer (unchanged from prior runs). 'shc' (Static Hyper-
  # Connections) and 'mhc' (Manifold-Constrained HC) widen the residual stream
  # to ``hc_n`` parallel hyper-hidden vectors mixed by a learnable matrix per
  # sublayer; identity-equivalent init keeps step 0 byte-equal to Pre-Norm.
  # See experiments/mHC_HC.md.
  residual_variant: prenorm
  hc_n: 4
  hc_sk_iters: 3      # Sinkhorn-Knopp iterations (mhc only).
  hc_sk_tau: 1.0      # Sinkhorn-Knopp temperature (mhc only).
