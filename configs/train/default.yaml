# @package _global_
training:
  batch_size: 8
  lr: 0.0001
  epochs: 5
  num_workers: 2
  checkpoint_path: ${hydra:runtime.cwd}/best_model.pt
  # Optional path to a checkpoint to resume from. When set, model weights and
  # the epoch/best-top1 metadata in ``extra`` are loaded. Optimizer, cosine
  # scheduler, and GradScaler states are restored when present and compatible
  # with the current optimizer param groups (see ``pipelines/train.py``).
  resume_from: null
  # PEFT LoRA (``model.lora_enabled=true``): separate LR for adapter tensors
  # matched by name (``lora_A`` / ``lora_B``). Head keeps ``training.lr``.
  # When ``null``, LoRA LR is ``lr * lora_lr_ratio``. Ignored if there are no
  # trainable LoRA weights.
  lora_lr: null
  lora_lr_ratio: 0.25
  # When true and the device is CUDA, training and evaluation forward passes
  # run under ``torch.amp.autocast`` (mixed FP16/BF16 + GradScaler). Off by
  # default for byte-for-byte parity with historical runs.
  amp: false
  device: cuda
  optimizer: adam
  momentum: 0.9
  nesterov: false
  weight_decay: 0.0
  scheduler_cosine: false
  warmup_epochs: 0
  min_lr: 0.0
  label_smoothing: 0.0
  videomix_alpha: 0.0
  videomix_prob: 1.0
  videomix_mode: cube_cutmix
  early_stopping_enabled: false
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  log_interval_steps: 0
  # Exponential Moving Average of model weights (Polyak averaging).
  # When enabled, an ``AveragedModel`` is updated after every optimizer step
  # and evaluated alongside the live model each epoch; whichever achieves the
  # higher val top1 is the one saved to ``checkpoint_path``. ``checkpoint_kind``
  # in the saved ``extra`` records which copy won.
  ema_enabled: false
  ema_decay: 0.999
  # Slim-validation gates (Phase 4.2 / Track B). Both default to the legacy
  # behaviour (eval every epoch, evaluate the EMA snapshot when EMA is on).
  # Used by ``pipelines/train.py`` to skip the (often dominant) cost of
  # repeated full val passes during heavy-aug training of large frozen
  # backbones like V-JEPA 2.
  # ``eval_every_n_epochs: N``  -> only run val (and update the best ckpt)
  #                                 every N epochs. The last epoch always
  #                                 evaluates so the recorded best is fresh.
  # ``eval_ema: false``         -> skip the second EMA val pass per epoch
  #                                 (saves ~50% of wall time when EMA is on).
  eval_every_n_epochs: 1
  eval_ema: true
  # Resume-safe "last" checkpoint persisted at the end of every epoch
  # (Phase 4.3). Independent from ``checkpoint_path`` (which only writes
  # on val_top1 improvement). Lets long overnight runs resume from the
  # last completed epoch after a crash via
  # ``training.resume_from=<best>.last.pt``.
  save_last_checkpoint: true
  # When null, derived from ``checkpoint_path`` by inserting ``.last``
  # before the extension (e.g. ``best.pt`` -> ``best.last.pt``).
  last_checkpoint_path: null
  # Test-Time Augmentation. Used by ``submit.py`` only (no effect on train).
  # ``tta: false``                 -> single deterministic forward pass.
  # ``tta_flip: true``             -> also evaluate horizontally-flipped clips
  #                                   and average softmaxes (with auto class-pair
  #                                   remap for left/right semantically-paired
  #                                   classes; the remap is derived from class
  #                                   folder names so it generalizes to any new
  #                                   class set).
  # ``tta_temporal_shift: int``    -> additionally evaluate ``k`` temporal
  #                                   start-offsets per clip (re-samples frame
  #                                   indices) and averages those too. ``0``
  #                                   disables it. (No-op when each video has
  #                                   exactly num_frames frames on disk.)
  # ``tta_scales: list[float]``    -> bilinear rescale the clip's spatial dims
  #                                   by each factor and evaluate. ``null`` or
  #                                   ``[1.0]`` ⇒ no multi-scale TTA. Typical:
  #                                   ``[0.875, 1.0, 1.125]``.
  # ``tta_logit_adjust: float``    -> long-tail correction (Menon et al. 2021).
  #                                   Subtract ``tau * log(p_c)`` from each
  #                                   logit, where p_c is the training-class
  #                                   frequency. ``0`` disables it. Typical
  #                                   range: 0.5..1.5.
  tta: false
  tta_flip: true
  tta_temporal_shift: 0
  tta_scales: null
  tta_logit_adjust: 0.0
  # Class-imbalance handling (Track-A train set has ~20x head/tail ratio).
  # ``class_balance_sampler``:
  #   "none"          -> uniform shuffle (legacy).
  #   "sqrt_inverse"  -> per-sample weight = 1 / sqrt(n_c). Recommended.
  #   "inverse"       -> 1 / n_c. Aggressive; risks hurting head-class accuracy.
  # ``class_balance_loss``:
  #   "none"          -> unweighted CE (legacy).
  #   "sqrt_inverse"  -> weight = 1 / sqrt(n_c), normalised to mean 1.
  #   "inverse"       -> weight = 1 / n_c, normalised to mean 1.
  #   "cb"            -> Cui et al. 2019 class-balanced loss:
  #                      w_c = (1 - beta) / (1 - beta^n_c), normalised.
  # ``class_balance_beta`` is the ``beta`` in the ``cb`` policy (0.999 default
  # is the paper's recommendation; closer to 1.0 ⇒ more aggressive).
  class_balance_sampler: none
  class_balance_loss: none
  class_balance_beta: 0.999
