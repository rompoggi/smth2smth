# @package _global_
training:
  batch_size: 8
  lr: 0.0001
  epochs: 5
  num_workers: 2
  checkpoint_path: ${hydra:runtime.cwd}/best_model.pt
  # Optional path to a checkpoint to resume from. When set, model weights and
  # the epoch/best-top1 metadata recorded in `extra` are loaded; the cosine
  # scheduler (if any) is fast-forwarded so the LR continues from the right
  # point. Optimizer state is not stored in the schema and therefore restarts.
  resume_from: null
  device: cuda
  optimizer: adam
  momentum: 0.9
  nesterov: false
  weight_decay: 0.0
  scheduler_cosine: false
  warmup_epochs: 0
  min_lr: 0.0
  label_smoothing: 0.0
  videomix_alpha: 0.0
  videomix_prob: 1.0
  videomix_mode: cube_cutmix
  early_stopping_enabled: false
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  log_interval_steps: 0
