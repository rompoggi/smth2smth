# @package _global_
# Champion VideoMAE fine-tune training recipe (experiment batch 2026-05-16).
training:
  batch_size: 8
  epochs: 60
  optimizer: adamw
  lr: 0.0005
  layer_decay: 0.75
  weight_decay: 0.05
  scheduler: cosine
  scheduler_cosine: true
  warmup_epochs: 6
  min_lr: 0.000001
  label_smoothing: 0.1
  videomix_mode: mixup_cutmix_switch
  videomix_mixup_alpha: 0.8
  videomix_cutmix_alpha: 1.0
  videomix_prob: 1.0
  videomix_switch_prob: 0.5
  repeated_aug: 2
  amp: true
  amp_dtype: bf16
  ema_enabled: true
  ema_decay: 0.9999
  early_stopping_enabled: true
  early_stopping_patience: 25
  early_stopping_min_delta: 0.001
  num_workers: 4
  log_interval_steps: 100
  device: cuda
